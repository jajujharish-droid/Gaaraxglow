name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q GlowXGaaraCheck.zip
      - run: cd GlowXGaaraCheck && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GlowXGaaraCheck-apk
          path: GlowXGaaraCheck/app/build/outputs/apk/debug/app-debug.apk
